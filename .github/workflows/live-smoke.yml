name: live-smoke

# Canary, not a merge gate. Hits a real cheap model to prove brain↔hands +
# safety rails end-to-end. Keep OFF required status checks — model flakiness
# should alert, not block. Nightly + manual; forks/no-secret skip without
# wasting a full sync.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *" # 07:00 UTC nightly

permissions:
  contents: read

concurrency:
  group: live-smoke
  cancel-in-progress: false

jobs:
  live:
    name: live brain↔hands smoke (DeepSeek)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Check for API key
        id: key
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "${DEEPSEEK_API_KEY}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No DEEPSEEK_API_KEY secret — live canary skipped."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv + Python
        if: steps.key.outputs.present == 'true'
        uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Sync (from lockfile)
        if: steps.key.outputs.present == 'true'
        run: uv sync --extra dev --frozen

      # Per-session USD cap + pytest-rerunfailures absorb a single API blip.
      # Do NOT pass --allow-hosts here — these tests need the network.
      - name: Run live tests
        if: steps.key.outputs.present == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RELAY_LIVE_MODEL: deepseek-v4-flash
          RELAY_LIVE_BUDGET_USD: "0.50"
        run: >
          uv run python -m pytest tests/live -m live -v
          --tb=short --reruns 1 --reruns-delay 5
