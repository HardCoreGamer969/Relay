name: quality

# Merge-gate hygiene: lockfile, package build, CLI entry point, website version
# sync, and secret scan. No advisory lint — ruff is not adopted in this repo
# (see AGENTS.md); a continue-on-error job only added noise.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: lock · build · CLI · website version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Assert uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Sync (from lockfile)
        run: uv sync --extra dev --frozen

      - name: Build wheel + sdist
        run: uv build

      - name: CLI entry point resolves and runs
        run: |
          uv run --frozen relay --help
          uv run --frozen python -c "import relay; print('relay', relay.__version__)"

      # stdlib-only script; --no-project would also work, but we already synced.
      - name: Website version badge matches code
        run: uv run --no-project python scripts/sync_version.py --check

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required for organization-owned repos.
