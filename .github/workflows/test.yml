name: tests

# The gating suite: the network-free unit/integration tests across a Python x OS
# matrix. No secrets needed — these tests never touch the network (enforced below).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Windows is a first-class target: Relay has repeatedly fixed Windows-only
        # tool bugs (mkdir -p, cp1252, apply_patch), so the windows leg guards a
        # real regression surface, not boilerplate.
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv + Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true
          cache-suffix: py${{ matrix.python-version }}
          python-version: ${{ matrix.python-version }}

      - name: Sync (from lockfile)
        run: uv sync --extra dev --frozen

      # --allow-hosts restricts socket connect() to loopback only: asyncio/Textual
      # internals (loopback socketpairs) keep working, while any real external call
      # is blocked — turning "all tests are network-free" into an enforced contract.
      - name: Run tests (external network blocked)
        run: uv run python -m pytest --allow-hosts=127.0.0.1,::1,localhost -q
