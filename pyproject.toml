[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "relay-cli"
# Version is declared in `relay/__init__.py` (`__version__`) and read by hatchling
# via the [tool.hatch.version] path below. Single source of truth -- the
# website/badge/scripts and the wheel can never silently disagree.
dynamic = ["version"]
description = "Relay — a planner/executor coding agent built on a model-agnostic, multi-provider seam."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Relay" }]
keywords = ["openrouter", "deepseek", "llm", "coding-agent", "planner-executor"]
dependencies = [
    "openai",
    "typer",
    "rich",
    "python-dotenv",
    "platformdirs",
    "textual",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-socket", "pytest-rerunfailures"]

# The brand is "Relay" and the CLI command is `relay`. The PyPI distribution
# name is `relay-cli` because the bare `relay` name is taken on the registries.
[project.scripts]
relay = "relay.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["relay"]

[tool.hatch.build.targets.wheel.force-include]
"relay/probes" = "relay/probes"

[tool.hatch.version]
# Source of truth: `relay/__init__.py:__version__`. The wheel (and any hatch-driven
# artifact) reads its version from here, so a forgotten `pyproject.toml` bump can
# no longer ship a stale version to PyPI.
path = "relay/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default suite is the network-free unit/integration tests. Live tests
# (tests/live/) hit a real provider API and are opt-in: they carry the ``live``
# marker and are DESELECTED by default here. CI's live-smoke job re-selects them
# with ``-m live`` (a later ``-m`` on the command line overrides this one).
addopts = "-m 'not live'"
markers = [
    "live: real cheap-model integration test that calls a provider API; needs a provider key; deselected by default",
]
